<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatAI RAG</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="RAG chat">
        <header class="top-bar">
          <div>
            <p class="eyebrow">LOTR manual assistant</p>
            <h1>ChatAI RAG</h1>
          </div>
          <div class="status-pill" id="statusPill">Ready</div>
        </header>

        <div class="conversation" id="conversation" aria-live="polite">
          <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="bubble">
              Ask a question about the manual. I will retrieve the best RAG context and answer it in natural language.
            </div>
          </article>
        </div>

        <form class="composer" id="chatForm">
          <label class="sr-only" for="questionInput">Question</label>
          <textarea
            id="questionInput"
            name="question"
            rows="2"
            placeholder="Example: How does combat work?"
            autocomplete="off"
            required
          ></textarea>
          <button id="sendButton" type="submit">Ask</button>
        </form>
      </section>

      <aside class="sources-panel" aria-label="Retrieved sources">
        <div class="sources-header">
          <p class="eyebrow">Retrieved context</p>
          <h2>Sources</h2>
        </div>
        <div class="sources-list" id="sourcesList">
          <p class="empty-state">Sources will appear after the first answer.</p>
        </div>
      </aside>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
